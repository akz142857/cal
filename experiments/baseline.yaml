name: baseline
seed: 0

environment:
  image_size: [16, 16]
  object_count: 3
  object_radius: 0.045
  include_vision: true
  include_proprioception: true
  include_touch: true
  include_action: true
  shuffle_modalities: false

model:
  recurrent_core: gru
  hidden_size: 128

data:
  train_seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  validation_seeds: [100, 101]
  test_seeds: [200, 201]
  steps_per_seed: 128
  sequence_length: 16
  stride: 8

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 1.0
  device: cpu

probe:
  train_seeds: [400, 401, 402, 403]
  validation_seeds: [450, 451]
  test_seeds: [500, 501, 502, 503]
  steps_per_seed: 128
  epochs: 100
  batch_size: 64
  learning_rate: 0.01
  weight_decay: 0.0
  device: cpu

adaptation:
  train_seeds: [300, 301]
  test_seeds: [350, 351]
  original_test_seeds: [600, 601]
  experience_budgets: [0, 32, 64, 128, 256]
  test_steps_per_seed: 128
  sequence_length: 8
  stride: 8
  optimization_epochs: 10
  batch_size: 16
  learning_rate: 0.0005
  device: cpu

cause_probe:
  train_seeds: [700, 701, 702, 703, 704, 705, 706, 707]
  validation_seeds: [750, 751]
  test_seeds: [800, 801, 802, 803]
  steps_per_seed: 256
  external_motion_probability: 0.5
  external_motion_distance: 0.08
  epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0
  device: cpu
