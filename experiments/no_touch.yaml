name: no_touch
seed: 0

environment:
  image_size: [16, 16]
  object_count: 3
  object_radius: 0.045
  include_vision: true
  include_proprioception: true
  include_touch: false
  include_action: true
  shuffle_modalities: false

model:
  recurrent_core: gru
  hidden_size: 128

data:
  train_seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  validation_seeds: [100, 101]
  test_seeds: [200, 201]
  steps_per_seed: 128
  sequence_length: 16
  stride: 8

training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 1.0
  device: cpu

probe:
  train_seeds: [400, 401, 402, 403]
  validation_seeds: [450, 451]
  test_seeds: [500, 501, 502, 503]
  steps_per_seed: 128
  epochs: 100
  batch_size: 64
  learning_rate: 0.01
  weight_decay: 0.0
  device: cpu
