name: m1f_action_envelope_no_action
seed: 0
environment:
  image_size: [16, 16]
  include_proprioception: false
  include_action: false
  external_object_motion_probability: 0.25
  distractor_body_count: 2
  distractor_body_motion_probability: 1.0
  input_blackout_probability: 0.25
  input_blackout_span: 4
model:
  recurrent_core: gru
  hidden_size: 128
  residual_prediction: false
  use_motion: true
  action_effect_size: 16
  part_slot_count: 3
  part_slot_size: 8
  part_slot_recurrent: true
data:
  train_seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  validation_seeds: [100, 101]
  test_seeds: [200, 201]
  steps_per_seed: 128
  sequence_length: 16
  stride: 8
  action_repeat_probability: 0.75
  counterfactual_action_effect: true
training:
  epochs: 20
  batch_size: 16
  action_effect_weight: 1.0
  action_effect_positive_weight: 8.0
  part_slot_weight: 1.0
  part_slot_positive_weight: 8.0
  part_slot_target: action_envelope
  device: cpu
probe:
  evaluation_external_motion_probability: 0.0
  train_seeds: [400, 401, 402, 403]
  validation_seeds: [450, 451]
  test_seeds: [500, 501, 502, 503]
  steps_per_seed: 128
  epochs: 100
  batch_size: 64
  learning_rate: 0.01
  projection_size: 128
  representation_source: part_slot_mask
  target_offset: current
  device: cpu
temporal_probe:
  period: 16
  start: 4
  length: 12
  policy: intervention
  representation_source: part_slot_mask
