[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cal"
version = "0.1.0"
description = "Experiments in developmental embodied learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "streamlit>=1.59,<2",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cal-record = "cal.learning.replay:main"
cal-train = "cal.learning.trainer:main"
cal-probe = "cal.evaluation.body_probe:main"
cal-adapt = "cal.evaluation.adaptation:main"
cal-cause-probe = "cal.evaluation.cause_probe:main"
cal-multiseed = "cal.evaluation.multiseed:main"
cal-efficiency = "cal.evaluation.efficiency:main"
cal-m1-summary = "cal.evaluation.m1_summary:main"
cal-index = "cal.infra.results:main"
cal-m1b-summary = "cal.evaluation.m1b_summary:main"
cal-counterfactual = "cal.evaluation.counterfactual:main"
cal-temporal-probe = "cal.evaluation.temporal_probe:main"
cal-temporal-summary = "cal.evaluation.temporal_summary:main"
cal-body-probe-summary = "cal.evaluation.body_probe_summary:main"
cal-adaptation-summary = "cal.evaluation.adaptation_summary:main"
cal-m1c-summary = "cal.evaluation.m1c_summary:main"
cal-v2-identifiability = "cal.evaluation.identifiability:main"
cal-v2-diagnostic-ceiling = "cal.evaluation.diagnostic_ceiling:main"
cal-v2-causal-sufficiency = "cal.evaluation.causal_sufficiency:main"
cal-v2-audit-summary = "cal.evaluation.v2_audit_summary:main"
cal-v2-m1 = "cal.evaluation.v2_m1:main"
cal-v2-m2 = "cal.evaluation.v2_m2:main"
cal-v2-m2-review = "cal.evaluation.v2_m2_review:main"
cal-v2-m3 = "cal.evaluation.v2_m3:main"
cal-v2-m3-hypotheses = "cal.evaluation.v2_m3_hypotheses:main"
cal-v2-m3-review = "cal.evaluation.v2_m3_review:main"
cal-v2-m1-m3-confirm = "cal.evaluation.v2_m1_m3_confirmation:main"
cal-v2-m1-m3-confirm-review = "cal.evaluation.v2_m1_m3_confirmation_review:main"
cal-v2-m4 = "cal.evaluation.v2_m4:main"
cal-v2-m4-unprivileged = "cal.evaluation.v2_m4_unprivileged:main"
cal-v2-i1 = "cal.evaluation.v2_i1_integration:main"
cal-v2-i1-v2 = "cal.evaluation.v2_i1_integration_v2:main"
cal-v2-stage-summary = "cal.evaluation.v2_stage_summary:main"

[tool.setuptools.packages.find]
include = ["cal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
