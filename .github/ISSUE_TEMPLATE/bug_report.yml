name: Bug report
description: Report a reproducible implementation or documentation problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, commit, configuration, and seed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, dependency versions, and relevant provenance.
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Safety check
      options:
        - label: This report contains no credentials, private data, or unpublished holdout material.
          required: true
