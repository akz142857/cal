name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundations
            tests: >-
              tests/test_[a-i]*.py
          - group: model-and-training
            tests: >-
              tests/test_[m-u]*.py
          - group: v2-audit-and-integration
            tests: >-
              tests/test_v2_audit_summary.py
              tests/test_v2_i1_integration.py
          - group: v2-integration-v2
            tests: >-
              tests/test_v2_i1_integration_v2.py
          - group: v2-i1-replay
            tests: >-
              tests/test_v2_i1_replay.py
          - group: v2-language
            tests: >-
              tests/test_v2_l0_language_readout.py
              tests/test_v2_l0_language_replay.py
          - group: v2-m1-and-m2
            tests: >-
              tests/test_v2_m1.py
              tests/test_v2_m1_m3_confirmation.py
              tests/test_v2_m1_m3_confirmation_review.py
              tests/test_v2_m2.py
              tests/test_v2_m2_review.py
          - group: v2-m3-and-world
            tests: >-
              tests/test_v2_m3.py
              tests/test_v2_m3_hypotheses.py
              tests/test_v2_m3_review.py
              tests/test_v2_m4.py
              tests/test_v2_m4_unprivileged.py
              tests/test_v2_stage_summary.py
              tests/test_world.py
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -vv ${{ matrix.tests }}
